name: Daily Engineering Log

on:
  schedule:
    # 6:00 AM CT = 11:00 UTC (CST) / 12:00 UTC (CDT)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate daily log entry
        run: python generate_log.py

      - name: Commit and push
        run: |
          git config user.name "Shubham Safaya"
          git config user.email "safayashubham@gmail.com"
          git add -A
          DATE=$(date -u +%Y-%m-%d)
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily log: ${DATE} — privacy, identity, and adtech updates"
            git push
          fi
